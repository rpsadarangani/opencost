name: build-cur-image
on:
  workflow_dispatch:
  push:
    branches: [build/cur1]
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build binaries
        run: |
          mkdir -p bin
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags "-X main.version=1.120.2-cur2 -X main.commit=${GITHUB_SHA::7}" -o bin/opencost-amd64 ./cmd/costmodel
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags "-X main.version=1.120.2-cur2 -X main.commit=${GITHUB_SHA::7}" -o bin/opencost-arm64 ./cmd/costmodel
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.multiarch
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/rpsadarangani/opencost:1.120.2-cur2
            ghcr.io/rpsadarangani/opencost:latest
